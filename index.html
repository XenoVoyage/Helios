<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#05060a">
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; connect-src 'none'; object-src 'none'; frame-src 'none'; worker-src 'none'; base-uri 'none'; form-action 'none'"
    >
    <title>Helios</title>
    <meta name="description" content="An interactive 3D orrery of the solar system.">
    <link rel="stylesheet" href="./styles.css">
    <script type="module" src="./js/app.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#dock">Skip to time controls</a>

    <main id="stage">
      <canvas id="viewport" tabindex="0" aria-label="Interactive solar system">
        Helios needs a browser with canvas and WebGL support.
      </canvas>
      <div id="labels" class="labels" aria-label="World labels"></div>

      <header class="topbar">
        <div class="brand">
          <p class="eyebrow">XenoVoyage</p>
          <h1>Helios</h1>
        </div>
        <p id="clock" class="clock" aria-live="polite">2000-01-01</p>
      </header>

      <section id="body-card" class="card" hidden>
        <div>
          <p id="card-kind" class="eyebrow">Planet</p>
          <h2 id="card-name">Earth</h2>
          <p id="card-meta" class="card-meta"></p>
        </div>
        <button id="card-close" type="button">Overview</button>
      </section>

      <footer id="dock" class="dock">
        <button id="play-button" type="button" aria-pressed="true">Pause</button>
        <div class="speed-group">
          <button id="slower-button" type="button" aria-label="Slower">−</button>
          <label class="speed-label">
            <span class="visually-hidden">Time speed</span>
            <input
              id="speed-slider"
              type="range"
              min="0"
              max="1"
              step="0.01"
              value="0.5"
            >
          </label>
          <button id="faster-button" type="button" aria-label="Faster">+</button>
          <span id="speed-readout">8 d / sec</span>
        </div>
        <button id="reset-button" type="button">Reset view</button>
      </footer>
    </main>

    <section id="unsupported" class="unsupported" hidden>
      <p class="eyebrow">Renderer unavailable</p>
      <h2>Helios could not start 3D graphics</h2>
      <p>Try enabling WebGL or opening this page in a current desktop or mobile browser.</p>
    </section>

    <p id="version-label" class="version">Helios</p>
    <div id="status-live" class="visually-hidden" role="status" aria-live="polite"></div>
  </body>
</html>
