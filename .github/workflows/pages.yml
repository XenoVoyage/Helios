name: Deploy GitHub Pages

on:
  workflow_run:
    workflows: [Audit]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      audit_run_id:
        description: Successful Audit run ID for the current main commit
        required: true
        type: string

permissions:
  contents: read
  actions: read
  checks: read
  pages: write
  id-token: write

jobs:
  deploy:
    if: >-
      github.ref == 'refs/heads/main' &&
      (
        github.event_name == 'workflow_dispatch' ||
        (
          github.event_name == 'workflow_run' &&
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.head_branch == 'main' &&
          github.event.workflow_run.head_repository.full_name == github.repository &&
          (
            github.event.workflow_run.event == 'push' ||
            github.event.workflow_run.event == 'workflow_dispatch'
          )
        )
      )
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # workflow_run's SHA is protected main, never the triggering PR's code.
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Verify exact-main Audit
        run: node scripts/verify-pages-audit.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          HELIOS_AUDIT_RUN_ID: ${{ github.event.workflow_run.id || inputs.audit_run_id }}

      - name: Verify static release
        run: npm run test:static

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        with:
          enablement: true

      - name: Stage static site
        run: node scripts/stage-site.mjs

      - name: Upload static site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
          include-hidden-files: true

      - name: Recheck exact-main Audit before deployment
        run: node scripts/verify-pages-audit.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          HELIOS_AUDIT_RUN_ID: ${{ github.event.workflow_run.id || inputs.audit_run_id }}

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
