name: Audit

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audit-${{ github.event_name }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  functional:
    name: functional
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Enforce manual audit source
        if: >-
          github.event_name == 'workflow_dispatch' &&
          github.ref != 'refs/heads/main'
        run: |
          echo "Manual audits are restricted to main."
          exit 1

      - name: Enforce production promotion source
        if: >-
          github.event_name == 'pull_request' &&
          github.base_ref == 'main' &&
          (
            github.event.pull_request.head.repo.full_name != github.repository ||
            (
              github.head_ref != 'develop' &&
              !startsWith(github.head_ref, 'hotfix/')
            )
          )
        run: |
          echo "Only this repository's develop or an explicitly reviewed hotfix/* branch may target main."
          exit 1

      - name: Check out repository
        # Preserve GitHub's merge-ref checkout for PR integration checks.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Install test dependencies
        run: npm ci

      - name: Run static and HTTP tests
        run: npm run test:static

  browser:
    name: browser (${{ matrix.group }})
    needs: functional
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        group: [platform, desktop-scenes, desktop-bodies, touch]
    steps:
      - name: Check out repository
        # Match the static job's proposed merge checkout on pull requests.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Install test dependencies
        run: npm ci

      - name: Install browser
        run: npx playwright install --with-deps chromium

      - name: Run complete browser group
        run: node tests/browser-smoke.mjs --group "$BROWSER_GROUP"
        env:
          BROWSER_GROUP: ${{ matrix.group }}
          HELIOS_SCREENSHOT_DIR: browser-stills

      - name: Upload rendered evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: helios-browser-${{ matrix.group }}
          path: browser-stills/
          if-no-files-found: error
          retention-days: 7

  comparison-baseline:
    name: comparison-baseline
    if: >-
      github.event_name == 'pull_request' &&
      github.base_ref == 'develop' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      main_sha: ${{ steps.baseline.outputs.main_sha }}
      main_tree: ${{ steps.baseline.outputs.main_tree }}
    steps:
      - name: Freeze main comparison baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/heads/main
          persist-credentials: false

      - name: Record immutable baseline
        id: baseline
        run: |
          printf 'main_sha=%s\nmain_tree=%s\n' \
            "$(git rev-parse HEAD)" "$(git rev-parse HEAD^{tree})" >> "$GITHUB_OUTPUT"
          printf 'Main visual baseline: `%s`, tree `%s`.\n' \
            "$(git rev-parse HEAD)" "$(git rev-parse HEAD^{tree})" >> "$GITHUB_STEP_SUMMARY"

  visual-capture:
    name: visual-capture (${{ matrix.group }})
    needs: comparison-baseline
    if: >-
      github.event_name == 'pull_request' &&
      github.base_ref == 'develop' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        group: [bodies-inner, bodies-giants, bodies-outer, moons-inner, moons-outer, touch-controls, responsive, desktop-states, touch-states, ordinary]
    steps:
      - name: Require the frozen main identity
        run: |
          [[ "$MAIN_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$MAIN_TREE" =~ ^[0-9a-f]{40}$ ]]
        env:
          MAIN_SHA: ${{ needs.comparison-baseline.outputs.main_sha }}
          MAIN_TREE: ${{ needs.comparison-baseline.outputs.main_tree }}

      - name: Check out capture harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: harness
          persist-credentials: false

      - name: Check out main renderer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.comparison-baseline.outputs.main_sha }}
          path: renderer-main
          persist-credentials: false

      - name: Check out develop base renderer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: renderer-develop
          persist-credentials: false

      - name: Check out candidate renderer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: renderer-candidate
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Install capture dependencies
        working-directory: harness
        run: npm ci

      - name: Install browser
        working-directory: harness
        run: npx playwright install --with-deps chromium

      - name: Capture matched sources on one runner
        working-directory: harness
        run: >-
          node scripts/capture-comparison.mjs
          --group "$CAPTURE_GROUP"
          --main ../renderer-main
          --develop ../renderer-develop
          --candidate ../renderer-candidate
          --output ../visual-stills
        env:
          CAPTURE_GROUP: ${{ matrix.group }}

      - name: Upload matched visual evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: helios-visual-${{ matrix.group }}
          path: visual-stills/
          if-no-files-found: warn
          retention-days: 7

  audit:
    name: audit
    if: always()
    needs: [functional, browser, comparison-baseline, visual-capture, focus-history]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out audit gate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Require every applicable audit job
        run: node scripts/verify-audit-jobs.mjs
        env:
          HELIOS_AUDIT_NEEDS: ${{ toJSON(needs) }}

  focus-history:
    name: focus-history
    if: >-
      github.event_name == 'pull_request' &&
      github.base_ref == 'develop' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out focus capture harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: harness
          persist-credentials: false

      - name: Check out issue 59 historical baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: c1f76d63c06853f8012569d2c19df6f499788a3c
          path: historical
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Install capture dependencies
        working-directory: harness
        run: npm ci

      - name: Install browser
        working-directory: harness
        run: npx playwright install --with-deps chromium

      - name: Capture historical focus sequences
        working-directory: harness
        run: >-
          node tests/visual-capture.mjs
          --source-root ../historical
          --output ../focus-history
          --source-label historical
          --group focus

      - name: Upload historical focus evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: helios-focus-history
          path: focus-history/
          if-no-files-found: warn
          retention-days: 7
