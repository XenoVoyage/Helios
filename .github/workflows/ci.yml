name: Audit

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audit-${{ github.event_name }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: audit
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Enforce manual audit source
        if: >-
          github.event_name == 'workflow_dispatch' &&
          github.ref != 'refs/heads/main'
        run: |
          echo "Manual audits are restricted to main."
          exit 1

      - name: Enforce production promotion source
        if: >-
          github.event_name == 'pull_request' &&
          github.base_ref == 'main' &&
          (
            github.event.pull_request.head.repo.full_name != github.repository ||
            (
              github.head_ref != 'develop' &&
              !startsWith(github.head_ref, 'hotfix/')
            )
          )
        run: |
          echo "Only this repository's develop or an explicitly reviewed hotfix/* branch may target main."
          exit 1

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Install test dependencies
        run: npm ci

      - name: Install browser
        run: npx playwright install --with-deps chromium

      - name: Run tests
        run: npm test
        env:
          HELIOS_SCREENSHOT_DIR: browser-stills

      - name: Upload rendered evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: helios-browser-stills
          path: browser-stills/
          if-no-files-found: ignore
          retention-days: 7

  visual-capture:
    name: visual-capture (${{ matrix.source }})
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        source: [main, develop, candidate]
    steps:
      - name: Check out capture harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: harness
          persist-credentials: false

      - name: Check out renderer source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.source == 'main' && 'refs/heads/main' || matrix.source == 'develop' && github.event.pull_request.base.sha || github.event.pull_request.head.sha }}
          path: renderer
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Install capture dependencies
        working-directory: harness
        run: npm ci

      - name: Install browser
        working-directory: harness
        run: npx playwright install --with-deps chromium

      - name: Capture exact source views
        working-directory: harness
        run: >-
          node tests/visual-capture.mjs
          --source-root ../renderer
          --output ../visual-stills/${{ matrix.source }}
          --source-label ${{ matrix.source }}

      - name: Upload matched visual evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: helios-visual-${{ matrix.source }}
          path: visual-stills/
          if-no-files-found: warn
          retention-days: 7
